name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Build locked release binaries
        run: |
          cargo build --release --locked --manifest-path app/Cargo.toml
          cargo build --release --locked --manifest-path player/Cargo.toml
      - name: Package Linux executables
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          package="still-files-${VERSION}-linux-x86_64"
          mkdir -p "dist/${package}"
          install -m 755 app/target/release/still-files "dist/${package}/still-files"
          install -m 755 player/target/release/player "dist/${package}/player"
          install -m 644 README.md "dist/${package}/README.md"
          install -m 644 player/README.md "dist/${package}/PLAYER.md"
          install -m 644 player/LICENSE "dist/${package}/PLAYER-LICENSE"
          ldd "dist/${package}/still-files" | tee dist/still-files-libraries.txt
          ldd "dist/${package}/player" | tee dist/player-libraries.txt
          if grep -q 'not found' dist/*-libraries.txt; then
              exit 1
          fi
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
              gh release create "$VERSION" --verify-tag --draft \
                  --title "Still Files ${VERSION}" \
                  --notes "Linux x86_64 binaries for Still Files and its integrated Player. Extract the archive and run ./still-files. Keep player alongside still-files. Requires glibc 2.35 or newer, an X11 or Wayland desktop, and OpenGL. Install ffmpeg and ffprobe for video playback and thumbnails. See the bundled README for optional tools. Verify the archive with the attached SHA-256 checksum."
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/*.sha256 --clobber
          gh release edit "$VERSION" --draft=false --latest
