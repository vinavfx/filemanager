[package]
name = "player"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Minimal frame-based image sequence and video viewer"
license = "BSD-3-Clause"

[dependencies]
bytemuck = "1.25"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
exr = "=1.74.2"
fs2 = "0.4"
rustix = { version = "1.1", features = ["process"] }
rayon-core = "1.13"
image = { version = "=0.25.5", default-features = false, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
serde_json = "1.0"
