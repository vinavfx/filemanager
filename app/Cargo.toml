[package]
name = "still-files"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "exr"] }
raw-window-handle = "0.6"
rustix = { version = "1.1", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
x11rb = { version = "0.13", features = ["render", "shape"] }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
winit = { path = "vendor/winit" }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
